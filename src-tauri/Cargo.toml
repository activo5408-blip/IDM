[package]
name = "msk-downloader"
version = "1.0.0"
description = "MSK Downloader"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "sync", "time"] }
url = "2"

[[bin]]
name = "msk-downloader"
path = "src/main.rs"
